name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `mir-client` 用 winit + softbuffer，Linux 上需要 X11/Wayland 的头文件才能编译
      # （CI 不创建窗口，只是把 bin 编出来）。
      - name: 安装 winit/softbuffer 的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev libwayland-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # 素材目录（resource/）不进仓库，依赖真实素材的测试会自行跳过。
        run: cargo test --workspace
      # 无头渲染测试会把截图写到 target/，失败时这些 PNG 是最有用的证据。
      - name: 归档客户端渲染截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: |
            target/client-*.png
            target/minimap-real.png
            target/players-layers.png
          if-no-files-found: ignore
          retention-days: 14

  protocol-codegen:
    name: 协议生成器与生成结果一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 克隆 Crystal（协议生成的输入）
        run: git clone --depth 1 https://github.com/Suprcode/Crystal.git "$RUNNER_TEMP/Crystal"
      - name: 生成器自检（生成结果必须与仓库中已提交的一致）
        run: python tools/protocol-gen/generate.py --crystal "$RUNNER_TEMP/Crystal" --check
