name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `mir-client` 用 winit + softbuffer，Linux 上需要 X11/Wayland 的头文件才能编译
      # （CI 不创建窗口，只是把 bin 编出来）。音频走 rodio → cpal → alsa-sys，
      # 需要 libasound2-dev 的头文件，否则 build script 直接失败。
      - name: 安装 winit/softbuffer/音频/字体的系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev libwayland-dev \
            libasound2-dev pkg-config \
            fonts-noto-cjk
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # 素材目录（resource/）不进仓库，依赖真实素材的测试会自行跳过。
        run: cargo test --workspace
      # 无头渲染测试会把截图写到 target/，失败时这些 PNG 是最有用的证据。
      - name: 归档客户端渲染截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: |
            target/client-*.png
            target/minimap-real.png
            target/players-layers.png
          if-no-files-found: ignore
          retention-days: 14

  protocol-codegen:
    name: 协议生成器与生成结果一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 克隆 Crystal（协议生成的输入）
        run: git clone --depth 1 https://github.com/Suprcode/Crystal.git "$RUNNER_TEMP/Crystal"
      - name: 生成器自检（生成结果必须与仓库中已提交的一致）
        run: python tools/protocol-gen/generate.py --crystal "$RUNNER_TEMP/Crystal" --check

  docs:
    name: 文档链接与包编号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 相对链接必须指向真实文件；README 文档表必须引用核心契约；市场包编号要与协议常量一致。
      - name: check_links
        run: >-
          python tools/docs/check_links.py
          --require docs/world/market.md,docs/world/trade.md,docs/world/aoi.md,docs/world/gameshop.md

  i18n:
    name: 国际化（文本键与硬编码棘轮）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 1) 每个 TextKey 都真的落到枚举/ALL/key()/args()/中英模板与两份语言包里（无孤儿键、无漏键）。
      - name: TextKey 与语言包闭合
        run: python tools/i18n/verify_text_keys.py
      # 2) 玩家可见硬编码不再增加。第 3 轮把 192 处迁到 TextKey，第 6 轮又把服务端
      #    `#[error]`/`anyhow` 的 261 处 Display 改英文，存量从 102 降到 66（含测试夹具）。
      #    剩下的 66 = 测试夹具 + 第 3 类数据名（怪物模板名/职业名），新增玩家可见文本
      #    请走 mir_core::i18n，否则这里会红（见 docs/i18n.md）。
      - name: 玩家可见硬编码棘轮
        run: >-
          python tools/i18n/scan_hardcoded.py
          --player-visible --strict --fail-above 70


  postgres:
    name: PostgreSQL 集成测试
    runs-on: ubuntu-latest
    # 这些用例在没有 MIR2_TEST_DATABASE_URL 时会**静默跳过**，本地很容易漏测；
    # 这里起一个一次性 PostgreSQL，把它们真正跑起来（迁移 0001..、事务原子性、重启读回）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mir2
          POSTGRES_PASSWORD: mir2
          POSTGRES_DB: mir2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mir2 -d mir2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      MIR2_TEST_DATABASE_URL: postgres://mir2:mir2@127.0.0.1:5432/mir2_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 只编 mir-store 与 mir-server：不装客户端那套 X11/Wayland 头文件。
      - name: store（迁移 + 账号/角色/行会往返）
        run: cargo test -p mir-store -- --test-threads=1
      - name: server（登录 / 行会 / 市场持久化 / 商城）
        run: >
          cargo test -p mir-server
          --test postgres_login --test postgres_guild
          --test market_persistence --test gameshop
          -- --test-threads=1

