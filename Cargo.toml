[workspace]
resolver = "3"
members = [
    "crates/mir-core",
    "crates/mir-db",
    "crates/mir-protocol",
    "crates/mir-store",
    "crates/mir-world",
    "crates/mir-server",
    "crates/mir-client",
    "crates/mir-render",
    "crates/mir-asset",
    "crates/mir-tools",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/PullAndRun/mir-next"
authors = ["PullAndRun"]

[workspace.dependencies]
mir-asset = { path = "crates/mir-asset" }
mir-core = { path = "crates/mir-core" }
mir-db = { path = "crates/mir-db" }
mir-protocol = { path = "crates/mir-protocol" }
mir-render = { path = "crates/mir-render" }
mir-store = { path = "crates/mir-store" }
mir-world = { path = "crates/mir-world" }

ab_glyph = "0.2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
png = "0.18"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
# 1.99 起新增的纯风格 lint：`assert!(x.is_empty())` 比 `assert_eq!(x, [])` 更直观，
# 且测试里大量用它表达「应当为空」。为保持测试可读性，工程内统一允许。
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
