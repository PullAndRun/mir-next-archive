[package]
name = "mir-asset"
description = "《传奇-Next》素材层：Crystal 图像库（.Lib / .wzl+.wzx）的解析与像素解码"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# 默认**不编译**老格式解码器（.Lib/.wzl/.wix/.wil/.wav）：运行时只读自有格式。
# 只有导入/构建工具（`mir-tools`）和迁移期测试开 `legacy`。
default = []
legacy = []

[dependencies]
flate2.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]

[lints]
workspace = true

# 老格式扫描/导出工具只在导入期用（`legacy` feature）。
[[example]]
name = "asset_scan"
required-features = ["legacy"]

[[test]]
name = "png_export"
required-features = ["legacy"]

[[test]]
name = "real_files"
required-features = ["legacy"]
