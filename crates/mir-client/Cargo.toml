[package]
name = "mir-client"
description = "《传奇-Next》客户端（渲染、界面与输入）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
mir-core.workspace = true
mir-protocol.workspace = true
mir-asset.workspace = true
mir-render.workspace = true
mir-world.workspace = true
serde.workspace = true
serde_json.workspace = true
# 窗口与软件呈现只出现在客户端；mir-render 保持纯 headless。
softbuffer = "0.4"
# 音效后端：纯 Rust、跨平台（Windows 走 WASAPI）。只有 mir-client 依赖音频库，
# `mir-render` 里的音效模块是纯数据（文件名映射）。
# 只开 `playback` + `wav` + `vorbis`：发布期音频是 `.mna` 里的 Vorbis 流。
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit = "0.30"

[dev-dependencies]
# 端到端联机测试在进程内起真实服务端（mir-server 依赖 tokio）。
mir-server = { path = "../mir-server" }
tokio = { workspace = true }

[lints]
workspace = true
