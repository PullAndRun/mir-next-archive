[package]
name = "mir-render"
description = "《传奇-Next》客户端地图渲染：纯软件 RGBA 光栅化与 Mir2 等距地图图层"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# 默认不编译老格式（`.wzl/.wil/.Lib`）解码：运行时只读自有格式。
default = []
legacy = ["mir-asset/legacy"]

[dependencies]
# TrueType 文字光栅化（HUD、对话框、背包等所有中文界面文字）。
ab_glyph.workspace = true
mir-asset.workspace = true
mir-core.workspace = true
mir-world.workspace = true
png.workspace = true
thiserror.workspace = true

[dev-dependencies]
# 集成测试把渲染结果编码成 PNG 后再解码回来做非空校验。
png.workspace = true
# 集成测试造 library-map.json / manifest.packs.json。
serde_json.workspace = true
# 合成测试自己拼 .wzl/.wzx，需要 zlib 压缩。
flate2.workspace = true

[lints]
workspace = true

# 这两个用例直接读 `resource/data/*.wzl` 对老格式解码做回归：只在导入期（`legacy`）跑。
[[test]]
name = "animation_assets"
required-features = ["legacy"]

[[test]]
name = "player_layers"
required-features = ["legacy"]

# 小地图用例读 `mmap.wzl`（老格式），只在 `legacy` 下跑。
[[test]]
name = "minimap"
required-features = ["legacy"]

# 地图渲染快照用例读 `resource/data` 的 `.wzl`，只在 `legacy` 下跑。
[[test]]
name = "render_map"
required-features = ["legacy"]
